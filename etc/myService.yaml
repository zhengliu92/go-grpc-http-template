Name: myservice.rpc
ListenOn: 0.0.0.0:8080
Mode: pro

# gRPC 超时 (ms)
Timeout: 3000

# CPU 自适应降载阈值 (0-1000, 0=关闭)
CpuThreshold: 900

# gRPC 健康检查
Health: true

# 服务发现 - etcd 注册 (gRPC 服务端启动时自动注册到 etcd)
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: myservice.rpc

# HTTP Gateway 配置 (gRPC -> HTTP 自动转换)
Gateway:
  Name: myservice-gw
  Host: 0.0.0.0
  Port: 8081
  Timeout: 5000
  Upstreams:
    - Grpc:
        # 通过 etcd 服务发现，与上方 Etcd.Key 对应
        Etcd:
          Hosts:
            - 127.0.0.1:2379
          Key: myservice.rpc
      # gateway 自动从 proto 描述符中读取 google.api.http 注解生成路由
      ProtoSets:
        - etc/myService.pb

# 日志配置
Log:
  ServiceName: myservice
  Mode: file
  Path: logs
  Level: info
  KeepDays: 15
  Compress: true
  MaxContentLength: 1024
  MaxSize: 200

# Prometheus 指标
